<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест распознавания речи</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e3e1dc;
    --accent: #2f6fde; --rec: #d93a3a; --good: #1f8a4c; --mid: #b7791f; --bad: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --card: #202023; --text: #f2f2f4; --muted: #9a9aa2; --line: #333338;
            --accent: #6a9cff; --rec: #ff5c5c; --good: #4cc27f; --mid: #e0a84a; --bad: #ff6b5e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .phrases button { display: block; width: 100%; text-align: left; background: none; border: 1px solid var(--line);
    color: var(--text); border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; cursor: pointer; font: inherit; }
  .phrases button:hover, .phrases button.on { border-color: var(--accent); }
  .phrases .tag { font-size: 11px; color: var(--muted); margin-right: 6px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  textarea, select { width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  textarea { min-height: 64px; resize: vertical; }
  #rec { width: 100%; margin-top: 14px; padding: 18px; font: 600 16px/1.2 inherit; font-family: inherit;
    border: 0; border-radius: 12px; background: var(--accent); color: #fff; cursor: pointer; user-select: none; }
  #rec.live { background: var(--rec); }
  #rec:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); font-size: 13px; margin-top: 8px; min-height: 20px; }
  .result { border-top: 1px solid var(--line); padding: 10px 0; }
  .result:first-of-type { border-top: 0; }
  .result .name { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .result .meta { font-weight: 400; color: var(--muted); font-size: 13px; }
  .result .text { margin-top: 4px; }
  .w-good { color: var(--good); } .w-mid { color: var(--mid); } .w-bad { color: var(--bad); }
  .hist { margin-top: 16px; }
  .hist .item { border-top: 1px solid var(--line); padding: 10px 0; font-size: 14px; }
  .hist .ref { color: var(--muted); }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Тест распознавания речи</h1>
  <p class="sub">Удерживай кнопку или пробел, говори, отпусти. Текст сразу распознают все три модели.</p>

  <div class="grid">
    <section class="card">
      <h2>Готовые фразы</h2>
      <p class="sub" style="margin:0 0 10px;font-size:13px">Нажми на фразу и прочитай её вслух — тогда посчитается процент ошибок. Можно говорить и что угодно своё.</p>
      <div class="phrases" id="phrases"></div>
    </section>

    <section class="card">
      <h2>Запись</h2>
      <label for="lang">Язык (для Whisper; GigaAM определяет сам)</label>
      <select id="lang">
        <option value="auto">Авто</option>
        <option value="ru">Русский</option>
        <option value="kk">Казахский</option>
      </select>
      <label for="ref">Что ты скажешь (необязательно, для подсчёта ошибок)</label>
      <textarea id="ref" placeholder="Оставь пустым, если говоришь своё"></textarea>
      <button id="rec" disabled>Загрузка…</button>
      <div id="status"></div>
    </section>
  </div>

  <section class="card" style="margin-top:16px">
    <h2>Результат</h2>
    <div id="results"><p class="empty">Пока пусто.</p></div>
  </section>

  <section class="card hist">
    <h2>История</h2>
    <div id="history"><p class="empty">Пока пусто.</p></div>
  </section>
</main>

<script>
const PHRASES = [
  ["ru", "Привет, напомни мне завтра в десять утра позвонить в банк."],
  ["ru", "Нужно проверить, работает ли авторизация через Apple на новой сборке."],
  ["ru", "В среду встречаемся в кафе возле метро, адрес скину позже."],
  ["kk", "Сәлеметсіз бе, бүгін кешке жиналысқа келе аласыз ба?"],
  ["kk", "Ертең таңертең сағат онда кездесейік."],
  ["kk", "Мен бұл жобаны келесі аптаға дейін аяқтаймын."],
  ["kk", "Қазақ тілінде сөйлегенде мәтін дұрыс жазылуы керек."],
  ["auto", "Слушай, ертең кездесу болады, не забудь ноутбук взять."],
];
const LANG_TAG = { ru: "RU", kk: "KK", auto: "RU+KK" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// --- фразы ---
PHRASES.forEach(([lang, text]) => {
  const b = document.createElement("button");
  b.innerHTML = `<span class="tag">${LANG_TAG[lang]}</span>${esc(text)}`;
  b.onclick = () => {
    document.querySelectorAll(".phrases button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    $("ref").value = text;
    $("lang").value = lang;
  };
  $("phrases").appendChild(b);
});

// --- запись ---
let stream, recorder, chunks = [], recording = false, busy = false;

async function start() {
  if (recording || busy) return;
  try {
    stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false } });
  } catch (e) {
    $("status").textContent = "Нет доступа к микрофону: " + e.message;
    return;
  }
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = send;
  recorder.start();
  recording = true;
  $("rec").classList.add("live");
  $("rec").textContent = "Говори… отпусти, чтобы распознать";
  $("status").textContent = "";
}

function stop() {
  if (!recording) return;
  recording = false;
  recorder.stop();
  $("rec").classList.remove("live");
  $("rec").textContent = "Распознаю…";
}

async function toWav16k(blob) {
  const buf = await blob.arrayBuffer();
  const ctx = new AudioContext();
  const decoded = await ctx.decodeAudioData(buf);
  ctx.close();
  const len = Math.ceil(decoded.duration * 16000);
  const off = new OfflineAudioContext(1, len, 16000);
  const src = off.createBufferSource();
  src.buffer = decoded;
  src.connect(off.destination);
  src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const out = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); out.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
  out.setUint32(24, 16000, true); out.setUint32(28, 32000, true); out.setUint16(32, 2, true);
  out.setUint16(34, 16, true); w(36, "data"); out.setUint32(40, pcm.length * 2, true);
  pcm.forEach((v, i) => out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, v)) * 0x7fff, true));
  return { wav: new Blob([out], { type: "audio/wav" }), seconds: decoded.duration };
}

async function send() {
  busy = true;
  $("rec").disabled = true;
  try {
    const { wav, seconds } = await toWav16k(new Blob(chunks, { type: recorder.mimeType }));
    if (seconds < 0.4) throw new Error("слишком короткая запись — держи кнопку, пока говоришь");
    if (seconds > 30) throw new Error("запись длиннее 30 секунд — Whisper берёт максимум 30");
    const fd = new FormData();
    fd.append("audio", wav, "rec.wav");
    fd.append("reference", $("ref").value.trim());
    fd.append("language", $("lang").value);
    const res = await fetch("/transcribe", { method: "POST", body: fd });
    if (!res.ok) throw new Error(await res.text());
    const rec = await res.json();
    renderResult(rec);
    loadHistory();
    $("status").textContent = `Запись ${rec.duration} с сохранена как ${rec.file}`;
  } catch (e) {
    $("status").textContent = "Ошибка: " + e.message;
  } finally {
    busy = false;
    $("rec").disabled = false;
    $("rec").textContent = "Удерживай, чтобы говорить (или пробел)";
  }
}

function werClass(w) { return w == null ? "" : w <= 10 ? "w-good" : w <= 25 ? "w-mid" : "w-bad"; }

function resultHtml(r) {
  const err = r.wer == null ? "" : ` · <span class="${werClass(r.wer)}">ошибок в словах ${r.wer}% · в буквах ${r.cer}%</span>`;
  return `<div class="result"><div class="name">${esc(r.model)}<span class="meta">${r.seconds} с${err}</span></div>
          <div class="text">${esc(r.text) || "<span class='empty'>(пусто)</span>"}</div></div>`;
}

function renderResult(rec) {
  const ref = rec.reference ? `<p class="sub" style="margin:0 0 6px">Эталон: ${esc(rec.reference)}</p>` : "";
  $("results").innerHTML = ref + rec.results.map(resultHtml).join("");
}

async function loadHistory() {
  const items = await (await fetch("/history")).json();
  $("history").innerHTML = items.length ? items.map((rec) => `
    <div class="item"><div class="ref">${rec.time.slice(9, 11)}:${rec.time.slice(11, 13)} · ${rec.duration} с · ${esc(rec.reference || "без эталона")}</div>
    ${rec.results.map(resultHtml).join("")}</div>`).join("") : '<p class="empty">Пока пусто.</p>';
}

const btn = $("rec");
btn.addEventListener("pointerdown", (e) => { e.preventDefault(); start(); });
btn.addEventListener("pointerup", stop);
btn.addEventListener("pointerleave", stop);
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !e.repeat && document.activeElement.tagName !== "TEXTAREA") { e.preventDefault(); start(); }
});
document.addEventListener("keyup", (e) => { if (e.code === "Space") stop(); });

fetch("/models").then((r) => r.json()).then((models) => {
  btn.disabled = false;
  btn.textContent = "Удерживай, чтобы говорить (или пробел)";
  $("status").textContent = "Модели: " + models.map((m) => m.name).join(", ");
});
loadHistory();
</script>
</body>
</html>
